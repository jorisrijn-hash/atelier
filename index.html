<!DOCTYPE html>
<html lang="en" data-theme="light">

<title>Atelier — Personal OS</title>
<meta name="description" content="A quiet operating system for an ambitious life." />

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />

<meta name="apple-mobile-web-app-title" content="Atelier" />

<meta name="theme-color" content="#1B1915" media="(prefers-color-scheme: dark)" />

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
/* ============================== TOKENS ============================== */
:root{
  --font-display:'Fraunces','Hoefler Text',Georgia,'Times New Roman',serif;
  --font-body:'Hanken Grotesk',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  --font-mono:ui-monospace,'SF Mono','JetBrains Mono',Menlo,monospace;

  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --ease-io:cubic-bezier(0.77,0,0.175,1);
  --ease-drawer:cubic-bezier(0.32,0.72,0,1);

  --z-nav:20; --z-sheet-bg:40; --z-sheet:50; --z-toast:60; --z-splash:80;

  --gutter:clamp(20px,6vw,34px);
  --maxw:640px;
}
html[data-theme="light"]{
  --paper:#F5F1E8; --surface:#FBF8F1; --raised:#FEFCF7;
  --hairline:#E4DDCF; --hairline-2:#D6CCB8;
  --ink:#2A2824; --ink-2:#5F594E; --ink-3:#736A5A;
  --gold:#8F7343; --gold-line:#B49768; --gold-soft:rgba(143,115,67,.10); --danger:#9a5a4e;
  --shadow:0 1px 2px rgba(42,40,36,.04),0 8px 30px rgba(42,40,36,.06);
  --scrim:rgba(42,40,36,.28);
}
html[data-theme="dark"]{
  --paper:#1B1915; --surface:#221F1A; --raised:#29251F;
  --hairline:#332F29; --hairline-2:#413B32;
  --ink:#ECE6DA; --ink-2:#ABA091; --ink-3:#968C7B;
  --gold:#C3A671; --gold-line:#8F7A55; --gold-soft:rgba(195,166,113,.10); --danger:#c98a7c;
  --shadow:0 1px 2px rgba(0,0,0,.30),0 12px 40px rgba(0,0,0,.35);
  --scrim:rgba(10,9,7,.55);
}

/* ============================== BASE ============================== */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font-body);
  background:var(--paper);color:var(--ink);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  font-size:16px;line-height:1.5;letter-spacing:-0.01em;
  overscroll-behavior-y:none;
  transition:background .6s var(--ease-out),color .6s var(--ease-out);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
input,textarea{font:inherit;color:inherit;background:none;border:none;outline:none}
::selection{background:var(--gold-soft)}
:focus-visible{outline:2px solid var(--gold-line);outline-offset:3px;border-radius:3px}
.mono{font-family:var(--font-mono)}
.serif{font-family:var(--font-display)}
.tnum{font-variant-numeric:tabular-nums}

.eyebrow{
  font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;
}
h1,h2,h3{font-family:var(--font-display);font-weight:400;line-height:1.06;text-wrap:balance;letter-spacing:-0.02em}
.hairline{height:1px;background:var(--hairline);border:0}
.gold-rule{height:1px;background:var(--gold-line);opacity:.5}

/* ============================== SHELL ============================== */
#app{position:relative;min-height:100dvh;max-width:100vw;overflow-x:hidden}
.screen{
  max-width:var(--maxw);margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 22px) var(--gutter) calc(env(safe-area-inset-bottom) + 116px);
  min-height:100dvh;
}
.view{animation:viewIn .42s var(--ease-out) both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.topbar{display:flex;align-items:baseline;justify-content:space-between;gap:14px;margin-bottom:30px}
.topbar .title{font-family:var(--font-display);font-size:30px;letter-spacing:-0.025em}
.topbar .sub{margin-top:6px}
.linkbtn{font-size:12.5px;color:var(--ink-2);letter-spacing:.02em;display:inline-flex;align-items:center;gap:5px;transition:color .25s var(--ease-out)}
@media(hover:hover){.linkbtn:hover{color:var(--ink)}}

/* stagger util */
.stagger>*{opacity:0;transform:translateY(10px);animation:rise .5s var(--ease-out) forwards}
.stagger>*:nth-child(1){animation-delay:.02s}.stagger>*:nth-child(2){animation-delay:.07s}
.stagger>*:nth-child(3){animation-delay:.12s}.stagger>*:nth-child(4){animation-delay:.17s}
.stagger>*:nth-child(5){animation-delay:.22s}.stagger>*:nth-child(6){animation-delay:.27s}
.stagger>*:nth-child(7){animation-delay:.32s}.stagger>*:nth-child(8){animation-delay:.37s}
@keyframes rise{to{opacity:1;transform:none}}

/* ============================== TAB BAR ============================== */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:var(--z-nav);
  padding:8px var(--gutter) calc(env(safe-area-inset-bottom) + 8px);
  display:flex;justify-content:center;
  transition:transform .5s var(--ease-drawer),opacity .4s var(--ease-out);
}
.tabbar.hidden{transform:translateY(140%);opacity:0;pointer-events:none}
.tabbar-inner{
  display:flex;gap:2px;width:100%;max-width:var(--maxw);
  background:color-mix(in srgb,var(--surface) 82%,transparent);
  -webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);
  border:1px solid var(--hairline);border-radius:22px;padding:6px;
  box-shadow:var(--shadow);
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:9px 4px 7px;border-radius:16px;color:var(--ink-3);
  transition:color .3s var(--ease-out),background .3s var(--ease-out);position:relative;
}
.tab svg{width:20px;height:20px;stroke-width:1.5}
.tab .lbl{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{
  content:"";position:absolute;top:5px;width:4px;height:4px;border-radius:50%;
  background:var(--gold);
}
@media(hover:hover){.tab:hover{color:var(--ink-2)}}
.tab:active{transform:scale(.94);transition:transform .12s var(--ease-out)}

/* ============================== PRIMITIVES ============================== */
.plate{
  background:var(--surface);border:1px solid var(--hairline);border-radius:18px;
  padding:20px;transition:border-color .3s var(--ease-out),background .3s var(--ease-out);
}
.row{display:flex;align-items:center;gap:14px}
.between{display:flex;align-items:center;justify-content:space-between;gap:14px}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.small{font-size:13px}
.xsmall{font-size:11.5px}

.check{
  width:26px;height:26px;border-radius:50%;border:1.5px solid var(--hairline-2);
  flex:0 0 auto;display:grid;place-items:center;
  transition:border-color .3s var(--ease-out),background .3s var(--ease-out);
}
.check svg{width:14px;height:14px;stroke-width:2;opacity:0;transform:scale(.6);transition:opacity .25s,transform .3s var(--ease-out)}
.check.on{border-color:var(--gold-line);background:var(--gold-soft)}
.check.on svg{opacity:1;transform:none;color:var(--gold)}
.check:active{transform:scale(.9);transition:transform .12s var(--ease-out)}

.pill{
  display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:100px;
  border:1px solid var(--hairline-2);font-size:13px;color:var(--ink-2);
  transition:all .25s var(--ease-out);
}
.pill svg{width:14px;height:14px;stroke-width:1.6}
@media(hover:hover){.pill:hover{border-color:var(--gold-line);color:var(--ink)}}
.pill:active{transform:scale(.96)}
.pill.solid{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.dots{display:flex;gap:6px;align-items:center}
.dots .d{width:7px;height:7px;border-radius:50%;background:var(--hairline-2);transition:background .3s var(--ease-out),transform .3s var(--ease-out)}
.dots .d.f{background:var(--gold)}

/* timeline row */
.tl{display:flex;align-items:flex-end;gap:5px;height:34px}
.tl .b{flex:1;background:var(--hairline);border-radius:3px;min-height:3px;transition:height .5s var(--ease-out),background .3s}
.tl .b.hi{background:var(--gold-line);opacity:.85}

/* ring */
.ring-wrap{position:relative;display:grid;place-items:center}
.ring-wrap svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--hairline);}
.ring-fg{fill:none;stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset .8s var(--ease-out)}

/* ============================== SHEETS ============================== */
.sheet-bg{
  position:fixed;inset:0;z-index:var(--z-sheet-bg);background:var(--scrim);
  opacity:0;pointer-events:none;transition:opacity .4s var(--ease-out);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
}
.sheet-bg.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:var(--z-sheet);
  background:var(--raised);border-top-left-radius:26px;border-top-right-radius:26px;
  border-top:1px solid var(--hairline);box-shadow:0 -20px 60px rgba(0,0,0,.14);
  transform:translateY(100%);transition:transform .46s var(--ease-drawer);
  max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px var(--gutter) calc(env(safe-area-inset-bottom) + 30px);
  max-width:var(--maxw);margin:0 auto;
}
.sheet.open{transform:none}
.grabber{width:38px;height:4px;border-radius:100px;background:var(--hairline-2);margin:0 auto 18px}
.field{margin-top:16px}
.field label{display:block;font-size:12px;letter-spacing:.02em;color:var(--ink-2);margin-bottom:8px}
.field input,.field textarea{
  width:100%;background:var(--surface);border:1px solid var(--hairline);border-radius:13px;
  padding:13px 15px;font-size:15px;transition:border-color .25s var(--ease-out);
}
.field textarea{min-height:110px;resize:vertical;line-height:1.55}
.field input:focus,.field textarea:focus{border-color:var(--gold-line)}
.btn{
  width:100%;padding:15px;border-radius:14px;background:var(--ink);color:var(--paper);
  font-size:15px;font-weight:500;letter-spacing:.01em;margin-top:22px;
  transition:transform .12s var(--ease-out),opacity .2s;
}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn.ghost[disabled] .spinner{border-top-color:var(--gold)}
.btn:active{transform:scale(.985)}
.btn.ghost{background:none;color:var(--ink-2);border:1px solid var(--hairline);margin-top:12px}
.btn.danger{background:none;color:#9a5a4e;border:1px solid var(--hairline)}
html[data-theme="dark"] .btn.danger{color:#c98a7c}

/* segmented */
.seg{display:flex;background:var(--surface);border:1px solid var(--hairline);border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px;border-radius:10px;font-size:13px;color:var(--ink-2);transition:all .28s var(--ease-out)}
.seg button.on{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}
.slider{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;cursor:pointer;margin:0}
.slider::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(to right,var(--gold-line) var(--p,0%),var(--hairline-2) var(--p,0%))}
.slider::-moz-range-track{height:4px;border-radius:4px;background:var(--hairline-2)}
.slider::-moz-range-progress{height:4px;border-radius:4px;background:var(--gold-line)}
.slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;margin-top:-8px;border-radius:50%;background:var(--raised);border:1.5px solid var(--gold);box-shadow:var(--shadow)}
.slider::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--raised);border:1.5px solid var(--gold);box-shadow:var(--shadow)}
.slider:focus-visible::-webkit-slider-thumb{outline:2px solid var(--gold-line);outline-offset:2px}
.field select,.select{width:100%;background:var(--surface);border:1px solid var(--hairline);border-radius:13px;padding:13px 15px;font-size:15px;color:var(--ink);font-family:var(--font-body);appearance:none;-webkit-appearance:none}
.field select:focus,.select:focus{border-color:var(--gold-line);outline:none}
.classrow.isnext{border-left:2px solid var(--gold-line);padding-left:15px;margin-left:-17px}

/* choice grid (mood, etc) */
.choices{display:flex;gap:8px;flex-wrap:wrap}
.choice{
  padding:11px 16px;border-radius:100px;border:1px solid var(--hairline-2);
  font-size:14px;color:var(--ink-2);transition:all .25s var(--ease-out)
}
.choice.on{border-color:var(--gold-line);color:var(--ink);background:var(--gold-soft)}
.choice:active{transform:scale(.96)}

/* ============================== EMPTY ============================== */
.empty{text-align:center;padding:44px 20px;color:var(--ink-3)}
.empty .serif{font-size:21px;color:var(--ink-2);margin-bottom:8px}
.empty p{font-size:13.5px;max-width:34ch;margin:0 auto}

/* ============================== SPLASH ============================== */
#splash{
  position:fixed;inset:0;z-index:var(--z-splash);background:var(--paper);
  display:grid;place-items:center;transition:opacity .8s var(--ease-out);
}
#splash.gone{opacity:0;pointer-events:none}
.mark{text-align:center}
.mark .glyph{font-family:var(--font-display);font-size:56px;color:var(--ink);letter-spacing:-0.03em;
  opacity:0;animation:markIn 1.1s var(--ease-out) .1s forwards}
.mark .wm{margin-top:14px;opacity:0;animation:markIn 1s var(--ease-out) .45s forwards}
@keyframes markIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.mark .line{width:0;height:1px;background:var(--gold-line);margin:18px auto 0;
  animation:lineGrow 1.1s var(--ease-out) .6s forwards}
@keyframes lineGrow{to{width:52px}}

/* Splash: indeterminate loader, gated on real font readiness in JS */
#splash .load{width:120px;height:1px;margin:32px auto 0;background:var(--hairline);
  position:relative;overflow:hidden;opacity:0;animation:markIn .8s var(--ease-out) .8s forwards}
#splash .load::after{content:"";position:absolute;inset:0;width:38%;
  background:var(--gold-line);animation:slide 1.2s var(--ease-io) infinite}
@keyframes slide{0%{transform:translateX(-130%)}100%{transform:translateX(345%)}}

/* Skeleton shimmer: shown once per view on first open */
.skeleton{position:relative;overflow:hidden;background:var(--surface);border-radius:12px}
.skeleton::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
  background:linear-gradient(100deg,transparent 22%,var(--raised) 46%,var(--gold-soft) 52%,var(--raised) 58%,transparent 80%);
  animation:shimmer 1.25s var(--ease-io) infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.sk-wrap{padding-top:6px}
.sk-wrap>*{margin-bottom:14px}
.sk-line{height:13px;border-radius:7px}
.sk-block{height:74px;border-radius:16px}
.sk-pill{height:34px;width:104px;border-radius:100px}
.sk-ring{height:120px;width:120px;border-radius:50%;margin:6px auto}

/* Inline spinner for async actions */
.spinner{display:inline-block;width:13px;height:13px;vertical-align:-2px;margin-right:7px;
  border:1.5px solid var(--hairline-2);border-top-color:var(--gold);border-radius:50%;
  animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============================== DEEP WORK ============================== */
#deep{
  position:fixed;inset:0;z-index:var(--z-sheet);background:var(--paper);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top) + 30px) var(--gutter) calc(env(safe-area-inset-bottom) + 30px);
  opacity:0;pointer-events:none;transition:opacity .7s var(--ease-out);
  text-align:center;
}
#deep.open{opacity:1;pointer-events:auto}
#deep .task{max-width:22ch;margin-bottom:44px;font-family:var(--font-display);font-size:26px;color:var(--ink);line-height:1.2}
#deep .timer{font-family:var(--font-display);font-size:64px;letter-spacing:-0.02em;color:var(--ink);margin-top:8px}
#deep .dctl{display:flex;gap:12px;margin-top:44px}
#deep .exit{position:absolute;top:calc(env(safe-area-inset-top) + 20px);right:var(--gutter)}

.toast{
  position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 128px);transform:translate(-50%,20px);
  z-index:var(--z-toast);background:var(--ink);color:var(--paper);
  padding:11px 20px;border-radius:100px;font-size:13px;letter-spacing:.01em;
  opacity:0;pointer-events:none;transition:opacity .35s var(--ease-out),transform .4s var(--ease-drawer);
  box-shadow:var(--shadow);
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms !important;transition-duration:.08s !important}
  .stagger>*{opacity:1;transform:none}
}
</style>
</head>
<body>

<div id="splash">
  <div class="mark">
    <div class="glyph">Atelier</div>
    <div class="line"></div>
    <div class="wm eyebrow" style="margin-top:20px">Personal Operating System</div>
    <div class="load"></div>
  </div>
</div>

<div id="app" aria-hidden="true">
  <main class="screen" id="screen"></main>
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
</div>

<div id="deep">
  <button class="exit pill" data-action="deep-exit">Close</button>
  <div class="eyebrow" style="margin-bottom:22px">Deep Work</div>
  <div class="ring-wrap" id="deepRing"></div>
  <div class="task" id="deepTask">A single, deliberate task.</div>
  <div class="dctl">
    <button class="pill" id="deepAmbient" data-action="deep-ambient">Ambient</button>
    <button class="pill solid" id="deepToggle" data-action="deep-toggle">Begin</button>
    <button class="pill" data-action="deep-reset">Reset</button>
  </div>
</div>

<div class="sheet-bg" id="sheetBg" data-action="sheet-close"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================================================
   Atelier — Personal OS.  Single file, vanilla, offline-first.
   Storage: localStorage with in-memory fallback (sandbox-safe).
   ============================================================ */

/* -------- storage (safe) -------- */
const KEY="atelier.v1";
let mem=null;
const store={
  get(){
    if(mem) return mem;
    try{const r=localStorage.getItem(KEY);return r?JSON.parse(r):null;}catch(e){return mem;}
  },
  set(v){
    mem=v;
    try{localStorage.setItem(KEY,JSON.stringify(v));}catch(e){/* in-memory only */}
  }
};

/* -------- helpers -------- */
const $=(s,r=document)=>r.querySelector(s);
const el=(tag,cls,html)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(html!=null)n.innerHTML=html;return n;};
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>new Date().toISOString().slice(0,10);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const esc=s=>(s==null?"":String(s)).replace(/"/g,'&quot;');
const isoAdd=(iso,n)=>{const d=new Date(iso+'T00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);};
const daysUntil=iso=>{if(!iso)return null;const a=new Date(today()+'T00:00'),b=new Date(iso+'T00:00');return Math.round((b-a)/86400000);};
const dueLabel=iso=>{const n=daysUntil(iso);if(n===null)return"No date";if(n<0)return"Overdue";if(n===0)return"Due today";if(n===1)return"Due tomorrow";if(n<=7)return"Due in "+n+" days";return"Due "+new Date(iso+'T00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});};
const toMin=hm=>{const p=(hm||"0:0").split(":");return (+p[0])*60+(+(p[1]||0));};

/* -------- theme -------- */
function applyTheme(){
  const t=S.profile.theme;
  const sysDark=window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").matches;
  const dark=t==="dark"||(t==="system"&&sysDark);
  document.documentElement.setAttribute("data-theme",dark?"dark":"light");
}
applyTheme();
window.matchMedia&&window.matchMedia("(prefers-color-scheme:dark)").addEventListener("change",()=>{if(S.profile.theme==="system")applyTheme();});

/* -------- toast -------- */
let toastT;
function toast(msg){
  const t=$("#toast");t.textContent=msg;t.classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1900);
}

const TABS=[["daily","Daily",I.daily],["academy","Academy",I.academy],["schedule","Schedule",I.cal],["deep","Deep Work",I.deep],["vision","Vision",I.vision]];

function renderTabs(){
  const bar=$("#tabbar");
  bar.innerHTML=`<div class="tabbar-inner">${TABS.map(([id,label,icon])=>`
    <button class="tab" data-tab="${id}" role="tab" aria-selected="${S.tab===id}" aria-label="${label}">
      ${svg(icon)}<span class="lbl">${label.split(" ")[0]}</span>
    </button>`).join("")}</div>`;
}

function render(){
  applyTheme();
  renderTabs();
  const s=$("#screen");
  const map={daily:viewDaily,academy:viewAcademy,schedule:viewSchedule,vision:viewVision};
  if(S.tab==="deep"){openDeep();return;}
  s.innerHTML="";
  const v=(map[S.tab]||viewDaily)();
  v.classList.add("view");
  s.appendChild(v);
  s.scrollTop=0;window.scrollTo(0,0);
}

/* First-open loading state. Data is local and renders instantly; a brief
   skeleton on the first visit to each view gives the app a considered,
   "loading-in" feel. Set SKELETONS=false to render every view immediately.
   Skipped entirely under prefers-reduced-motion. */
const SKELETONS=true, SKELETON_MS=300;
const warmed=new Set();
let navSeq=0;
function reducedMotion(){
  try{return matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(_){return false;}
}
function skeletonEl(id){
  const w=document.createElement("div");
  w.className="view sk-wrap";
  const L=(width,h)=>`<div class="skeleton sk-line" style="width:${width}${h?';height:'+h+'px':''}"></div>`;
  let inner=`<div style="height:34px"></div>`+L("38%")+L("72%",30);
  if(id==="academy"){
    inner+=`<div class="skeleton" style="height:44px;border-radius:12px;margin:6px 0 4px"></div>`;
    inner+=`<div class="skeleton sk-block"></div>`.repeat(4);
  }else if(id==="schedule"){
    inner+=`<div class="skeleton sk-line" style="width:30%;height:11px;margin:4px 0 10px"></div>`;
    inner+=`<div class="skeleton sk-block" style="height:58px"></div>`.repeat(5);
  }else if(id==="vision"){
    inner+=`<div class="skeleton sk-block" style="height:66px"></div>`.repeat(5);
  }else{
    inner+=`<div class="skeleton sk-block" style="height:112px"></div>`;
    inner+=`<div style="display:flex;gap:12px"><div class="skeleton sk-block" style="flex:1"></div><div class="skeleton sk-block" style="flex:1"></div></div>`;
    inner+=`<div class="skeleton sk-block" style="height:90px"></div>`;
  }
  w.innerHTML=inner;
  return w;
}
function setTab(id){
  if(id===S.tab&&id!=="deep")return;
  if(id==="deep"){S.tab="deep";openDeep();renderTabs();return;}
  S.tab=id;save();haptic(6);
  if(SKELETONS && !reducedMotion() && !warmed.has(id)){
    warmed.add(id);
    applyTheme();renderTabs();
    const s=$("#screen");
    s.innerHTML="";s.appendChild(skeletonEl(id));
    s.scrollTop=0;window.scrollTo(0,0);
    const my=++navSeq;
    setTimeout(()=>{ if(my===navSeq) render(); }, SKELETON_MS);
  }else{
    ++navSeq;
    render();
  }
}

function essRow(label,main,meta,action){
  return `<div class="between" data-action="${action}" style="padding:15px 0;cursor:pointer;border-bottom:1px solid var(--hairline)">

function nextClassInfo(){
  const cls=S.schedule.classes;
  if(!cls.length)return null;
  const now=new Date();
  const nowMin=now.getHours()*60+now.getMinutes();
  const todIdx=(now.getDay()+6)%7;
  let best=null;
  for(let off=0;off<7&&!best;off++){
    const day=(todIdx+off)%7;
    const dayCls=cls.filter(c=>c.day===day).sort((a,b)=>toMin(a.start)-toMin(b.start));
    for(const c of dayCls){
      if(off===0&&toMin(c.start)<=nowMin)continue;
      best={c,off,day};break;
    }
  }
  return best;
}
function nextClassRow(){
  const nx=nextClassInfo();
  const main=nx?nx.c.subject:"No upcoming classes";
  let meta="Set up in Schedule";
  if(nx){
    const when=nx.off===0?"Today":nx.off===1?"Tomorrow":DAY_SHORT[nx.day];
    meta=`${when} ${nx.c.start}${nx.c.room?" · "+nx.c.room:""}`;
  }
  return `<div class="between" data-action="go-schedule" style="padding:15px 0;cursor:pointer;border-bottom:1px solid var(--hairline)">
    <div><div class="small muted">Next class</div>
      <div style="margin-top:3px;font-size:16px;color:${nx?'var(--ink)':'var(--ink-3)'}">${esc(main)}</div></div>
    <div class="row"><div class="xsmall faint">${meta}</div>${svg(I.chevron,16)}</div>
  </div>`;
}

/* ---------------- ACADEMY ---------------- */
function courseworkOverview(){
  const all=S.coursework.slice();
  const open=all.filter(a=>a.status!=="done");
  const dueSoon=open.filter(a=>{const n=daysUntil(a.due);return n!==null&&n<=7;}).length;
  const doing=all.filter(a=>a.status==="doing").length;
  const done=all.filter(a=>a.status==="done").length;
  const sorted=all.sort((a,b)=>{
    const ad=a.status==="done",bd=b.status==="done";
    if(ad!==bd)return ad?1:-1;
    return (a.due||"9999").localeCompare(b.due||"9999");
  });
  const rows=sorted.length?sorted.map(courseworkRow).join(""):emptyState("No coursework yet","Add an assignment to start your overview.");
  return `
    <div class="between" style="margin-bottom:16px">
      <div class="eyebrow">Coursework</div>
      <button class="linkbtn" data-action="add-work">${svg(I.plus,14)} Assignment</button>
    </div>
    <div class="row" style="gap:10px;margin-bottom:22px">
      ${statChip(dueSoon,"Due soon")}${statChip(doing,"In progress")}${statChip(done,"Done")}
    </div>
    <div class="stagger">${rows}</div>`;
}
function statChip(n,label){
  return `<div class="plate" style="flex:1;padding:15px 10px;text-align:center">
    <div class="serif tnum" style="font-size:25px">${n}</div>
    <div class="xsmall faint" style="margin-top:4px">${label}</div></div>`;
}
function courseworkRow(a){
  const done=a.status==="done";
  const st=done?"Done":(a.status==="doing"?"Doing":"To do");
  const n=daysUntil(a.due);
  const overdue=!done&&n!==null&&n<0;
  return `<div class="between" data-action="edit-work" data-id="${a.id}" style="padding:15px 0;cursor:pointer;border-bottom:1px solid var(--hairline)">
    <div class="row" style="gap:14px">
      <button class="check ${done?'on':''}" data-action="toggle-work" data-id="${a.id}" aria-label="Toggle done">${svg(I.check,14)}</button>
      <div>
        <div class="serif" style="font-size:18px;${done?'opacity:.55':''}">${esc(a.title)}</div>
        <div class="xsmall faint" style="margin-top:3px">${[a.subject,dueLabel(a.due)].filter(Boolean).join(" · ")}${done&&a.grade?" · "+esc(a.grade):""}</div>
      </div>
    </div>
    <div class="xsmall" style="color:${overdue?'var(--danger)':'var(--ink-3)'};white-space:nowrap">${overdue?"Overdue":st}</div>
  </div>`;
}

  </svg></div>`;
}

let deepInt=null, audioCtx=null, ambientNode=null, ambientGain=null, ambientOn=false;

function deepRing(){
  const r=104,c=2*Math.PI*r;
  const total=S.deep.minutes*60;
  const frac=clamp(S.deep.remaining/total,0,1);
  $("#deepRing").innerHTML=`<svg width="240" height="240">
    <circle class="ring-bg" cx="120" cy="120" r="${r}" stroke-width="2"/>
    <circle class="ring-fg" cx="120" cy="120" r="${r}" stroke-width="2" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-frac)}"/>
  </svg>
  <div style="position:absolute;text-align:center">
    <div class="timer tnum" id="deepClock">${mmss(S.deep.remaining)}</div>
    <button class="linkbtn" data-action="deep-duration" style="margin-top:10px">${S.deep.minutes} min session</button>
  </div>`;
}
function mmss(sec){const m=Math.floor(sec/60),s=sec%60;return `${m}:${String(s).padStart(2,'0')}`;}
function openDeep(){
  const dw=$("#deep");
  S.deep.task=S.deep.task||S.daily.focus.text||"";
  $("#deepTask").textContent=S.deep.task||"A single, deliberate task.";
  deepRing();
  $("#deepToggle").textContent=S.deep.running?"Pause":"Begin";
  dw.classList.add("open");
  $("#tabbar").classList.add("hidden");
  document.body.style.background="var(--paper)";
  if(S.deep.running)startDeep(true);
}
function closeDeep(){
  stopDeep();
  $("#deep").classList.remove("open");
  $("#tabbar").classList.remove("hidden");
  stopAmbient();
  S.tab="daily";save();render();
}
function tickDeep(){
  S.deep.remaining=Math.max(0,S.deep.remaining-1);
  const clk=$("#deepClock");if(clk)clk.textContent=mmss(S.deep.remaining);
  deepRingUpdate();
  if(S.deep.remaining<=0){completeDeep();}
}
function deepRingUpdate(){
  const r=104,c=2*Math.PI*r,total=S.deep.minutes*60;
  const fg=$("#deepRing .ring-fg");if(fg)fg.style.strokeDashoffset=c*(1-clamp(S.deep.remaining/total,0,1));
}
function startDeep(resume){
  if(!resume){S.deep.running=true;}
  $("#deepToggle").textContent="Pause";
  clearInterval(deepInt);
  deepInt=setInterval(tickDeep,1000);
  haptic(10);
}
function stopDeep(){clearInterval(deepInt);deepInt=null;}
function pauseDeep(){S.deep.running=false;stopDeep();$("#deepToggle").textContent="Resume";save();}
function completeDeep(){
  stopDeep();S.deep.running=false;S.deep.remaining=S.deep.minutes*60;save();
  chime();$("#deepToggle").textContent="Begin";deepRing();
  toast("Session complete. Well done.");
}

/* ambient audio (soft filtered noise) — created on gesture */
function ensureAudio(){
  if(!audioCtx){try{audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}}
  if(audioCtx.state==="suspended")audioCtx.resume();
  return audioCtx;
}
function startAmbient(){
  const ctx=ensureAudio();if(!ctx)return;
  const bufSize=2*ctx.sampleRate;
  const buf=ctx.createBuffer(1,bufSize,ctx.sampleRate);
  const data=buf.getChannelData(0);
  let lastOut=0;
  for(let i=0;i<bufSize;i++){ // brown noise
    const white=Math.random()*2-1;
    data[i]=(lastOut+0.02*white)/1.02;lastOut=data[i];data[i]*=3.2;
  }
  const src=ctx.createBufferSource();src.buffer=buf;src.loop=true;
  const filter=ctx.createBiquadFilter();filter.type="lowpass";filter.frequency.value=520;
  const g=ctx.createGain();g.gain.value=0;
  src.connect(filter);filter.connect(g);g.connect(ctx.destination);
  src.start();
  g.gain.linearRampToValueAtTime(0.16,ctx.currentTime+1.2);
  ambientNode=src;ambientGain=g;ambientOn=true;
  $("#deepAmbient").classList.add("solid");
}
function stopAmbient(){
  if(ambientGain&&audioCtx){ambientGain.gain.linearRampToValueAtTime(0,audioCtx.currentTime+0.5);}
  if(ambientNode){const n=ambientNode;setTimeout(()=>{try{n.stop();}catch(e){}},600);}
  ambientNode=null;ambientOn=false;
  const b=$("#deepAmbient");if(b)b.classList.remove("solid");
}
function chime(){
  const ctx=ensureAudio();if(!ctx)return;
  [523.25,659.25,783.99].forEach((f,i)=>{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type="sine";o.frequency.value=f;
    const t=ctx.currentTime+i*0.14;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(0.12,t+0.04);
    g.gain.exponentialRampToValueAtTime(0.0001,t+1.4);
    o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+1.5);
  });
}

function onboarding(){
  let step=0;
  const steps=[
    ()=>`<div class="eyebrow">Welcome</div>
      <h1 style="font-size:34px;margin:14px 0 10px;line-height:1.1">A quiet place<br/>to run your life.</h1>
      <p class="muted" style="max-width:34ch;line-height:1.6;margin-bottom:8px">No noise. No streaks to guilt you. Just the few things that compound, kept close.</p>
      <button class="btn" data-ob="next">Begin</button>`,
    ()=>`<div class="eyebrow">You</div>
      <h1 style="font-size:32px;margin:14px 0 18px">What should it call you?</h1>
      <div class="field"><input id="ob_name" placeholder="Your first name" value="${(S.profile.name||'').replace(/"/g,'&quot;')}"/></div>
      <button class="btn" data-ob="name">Continue</button>`,
    ()=>`<div class="eyebrow">Direction</div>
      <h1 style="font-size:30px;margin:14px 0 10px;line-height:1.15">What are you building toward?</h1>
      <p class="muted small" style="margin-bottom:16px">One line. You can change it whenever.</p>
      <div class="field"><textarea id="ob_goal" placeholder="e.g. Graduate at the top and build a calm, profitable studio.">${S.profile.goal||''}</textarea></div>
      <button class="btn" data-ob="goal">Continue</button>`,
    ()=>`<div class="eyebrow">Appearance</div>
      <h1 style="font-size:32px;margin:14px 0 18px">Light or dark?</h1>
      <div class="seg">${["system","light","dark"].map(t=>`<button data-ob-theme="${t}" class="${S.profile.theme===t?'on':''}">${t[0].toUpperCase()+t.slice(1)}</button>`).join("")}</div>
      <button class="btn" data-ob="done" style="margin-top:26px">Enter Atelier</button>`
  ];
  const box=$("#screen");
  $("#tabbar").classList.add("hidden");
  $("#app").setAttribute("aria-hidden","false");
  const draw=()=>{box.innerHTML=`<div class="view" style="padding-top:12vh">${steps[step]()}</div>`;};
  draw();
  box.onclick=(e)=>{
    const t=e.target.closest("[data-ob],[data-ob-theme]");if(!t)return;
    if(t.dataset.obTheme){S.profile.theme=t.dataset.obTheme;applyTheme();
      box.querySelectorAll("[data-ob-theme]").forEach(b=>b.classList.toggle("on",b.dataset.obTheme===t.dataset.obTheme));return;}
    const a=t.dataset.ob;
    if(a==="next"){step++;draw();}
    else if(a==="name"){S.profile.name=($("#ob_name").value||"").trim();step++;draw();}
    else if(a==="goal"){S.profile.goal=($("#ob_goal").value||"").trim();
      if(S.profile.goal&&!S.vision.sections.future.length)S.vision.sections.future.unshift({type:"note",text:S.profile.goal});
      step++;draw();}
    else if(a==="done"){S.onboarded=true;save();box.onclick=null;$("#tabbar").classList.remove("hidden");render();}
  };
}

document.addEventListener("click",(e)=>{
  const tabBtn=e.target.closest("[data-tab]");
  if(tabBtn){setTab(tabBtn.dataset.tab);return;}

  const a=e.target.closest("[data-action]");
  if(!a)return;
  const act=a.dataset.action;
  const d=S.daily;

  switch(act){
    /* daily */
    case "toggle-focus":e.stopPropagation();d.focus.done=!d.focus.done;save();haptic();render();break;
    case "edit-focus":sheetFocus();break;
    case "save-focus":d.focus.text=($("#f_focus").value||"").trim();save();closeSheet();render();break;
    case "edit-session":sheetSession();break;
    case "save-session":d.session.subject=($("#f_subj").value||"").trim();d.session.active=!!d.session.subject;save();closeSheet();render();break;
    case "edit-mood":sheetMood();break;
    case "set-mood":d.mood=+a.dataset.v;save();haptic();closeSheet();render();break;
    case "go-schedule":setTab("schedule");break;
    case "go-academy":setTab("academy");break;
    case "open-journal":sheetJournal();break;
    case "save-journal":{const t=($("#f_journal").value||"").trim();if(t){S.journal.push({date:today(),text:t});save();toast("Saved.");}closeSheet();break;}
    case "open-review":sheetReview();break;
    case "save-review":{toast("Reflection saved.");closeSheet();break;}

    /* schedule */
    case "add-class":sheetClass();break;
    case "edit-class":sheetClass(a.dataset.id);break;
    case "save-class":{
      const c={subject:($("#c_subject").value||"").trim(),day:+$("#c_day").value,start:$("#c_start").value||"",end:$("#c_end").value||"",room:($("#c_room").value||"").trim(),teacher:($("#c_teacher").value||"").trim()};
      if(!c.subject){toast("Add a subject.");break;}
      const id=a.dataset.id;
      if(id){Object.assign(S.schedule.classes.find(x=>x.id===id),c);}else{S.schedule.classes.push({id:uid(),...c});}
      save();closeSheet();render();break;
    }
    case "delete-class":{S.schedule.classes=S.schedule.classes.filter(x=>x.id!==a.dataset.id);save();closeSheet();render();break;}

    /* coursework */
    case "add-work":sheetWork();break;
    case "edit-work":sheetWork(a.dataset.id);break;
    case "toggle-work":{const w=S.coursework.find(x=>x.id===a.dataset.id);if(w){w.status=w.status==="done"?"todo":"done";save();haptic();render();}break;}
    case "work-status":{const seg=$("#w_seg");if(seg)seg.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===a));break;}
    case "save-work":{
      const st=($("#w_seg .on")&&$("#w_seg .on").dataset.v)||"todo";
      const obj={title:($("#w_title").value||"").trim(),subject:($("#w_subject").value||"").trim(),due:$("#w_due").value||"",status:st,grade:($("#w_grade").value||"").trim(),notes:($("#w_notes").value||"").trim()};
      if(!obj.title){toast("Add a title.");break;}
      const id=a.dataset.id;
      if(id){Object.assign(S.coursework.find(x=>x.id===id),obj);}else{S.coursework.push({id:uid(),...obj});}
      save();closeSheet();render();break;
    }
    case "delete-work":{S.coursework=S.coursework.filter(x=>x.id!==a.dataset.id);save();closeSheet();render();break;}

    /* academy */
    case "open-domain":S.academy.open=a.dataset.id;save();render();break;
    case "close-domain":S.academy.open=null;save();render();break;
    case "toggle-mastered":{const dm=S.academy.domains.find(x=>x.id===a.dataset.did);const t=dm.topics.find(x=>x.id===a.dataset.id);t.mastered=!t.mastered;save();haptic();render();break;}
    case "add-topic":sheetAddTopic(a.dataset.id);break;
    case "commit-topic":{const dm=S.academy.domains.find(x=>x.id===a.dataset.did);const title=($("#t_title").value||"").trim();if(title){dm.topics.push({id:uid(),title,mastered:false,notes:($("#t_notes").value||"").trim(),snippet:($("#t_snip").value||"").trim()});save();}closeSheet();render();break;}
    case "edit-topic":sheetEditTopic(a.dataset.did,a.dataset.id);break;
    case "update-topic":{const dm=S.academy.domains.find(x=>x.id===a.dataset.did);const t=dm.topics.find(x=>x.id===a.dataset.id);t.title=($("#t_title").value||"").trim()||t.title;t.notes=($("#t_notes").value||"").trim();t.snippet=($("#t_snip").value||"").trim();save();closeSheet();render();break;}
    case "delete-topic":{const dm=S.academy.domains.find(x=>x.id===a.dataset.did);dm.topics=dm.topics.filter(x=>x.id!==a.dataset.id);save();closeSheet();render();break;}
    case "copy-snippet":{const s=decodeURIComponent(a.dataset.snip);navigator.clipboard&&navigator.clipboard.writeText(s).then(()=>toast("Copied")).catch(()=>toast("Copy unavailable"));break;}

    /* vision */
    case "add-vision":sheetAddVision(a.dataset.key);break;
    case "commit-vision":{const key=a.dataset.key;const text=($("#v_text").value||"").trim();const type=$("#v_pin")&&$("#v_pin").classList.contains("on")?"pin":"note";if(text){S.vision.sections[key].push({type,text});save();}closeSheet();render();break;}
    case "toggle-pin":{const b=$("#v_pin");b.classList.toggle("on");break;}
    case "del-vision":{S.vision.sections[a.dataset.key].splice(+a.dataset.idx,1);save();render();break;}

    /* deep work */
    case "deep-toggle":if(S.deep.running){pauseDeep();}else{if(S.deep.remaining<=0)S.deep.remaining=S.deep.minutes*60;startDeep(false);save();}break;
    case "deep-reset":pauseDeep();S.deep.remaining=S.deep.minutes*60;save();deepRing();$("#deepToggle").textContent="Begin";break;
    case "deep-exit":closeDeep();break;
    case "deep-ambient":ambientOn?stopAmbient():startAmbient();break;
    case "deep-duration":sheetDeepDuration();break;
    case "set-duration":{S.deep.minutes=+a.dataset.m;S.deep.remaining=S.deep.minutes*60;save();closeSheet();deepRing();break;}

    /* settings */
    case "open-settings":sheetSettings();break;
    case "set-theme":S.profile.theme=a.dataset.t;applyTheme();$("#sheet").querySelectorAll("[data-action='set-theme']").forEach(b=>b.classList.toggle("on",b.dataset.t===a.dataset.t));break;
    case "save-settings":S.profile.name=($("#s_name").value||"").trim();save();closeSheet();render();toast("Saved.");break;
    case "export-data":exportData();break;
    case "reset-data":if(confirm("Reset everything? This cannot be undone.")){S=defaults();S.onboarded=true;save();closeSheet();render();}break;

    case "sheet-close":closeSheet();break;
  }
});

function sheetAddVision(key){
  const name=(VISION_SECTIONS.find(s=>s[0]===key)||["",""])[1];
  openSheet(`${sheetHead("Vision",name)}
    <div class="field"><label>Add a note or a pinned inspiration</label><textarea id="v_text" placeholder="Write what you're reaching for."></textarea></div>
    <div class="row" style="margin-top:14px;gap:12px">
      <button class="choice on" id="v_pin" data-action="toggle-pin">Pin it</button>
      <span class="xsmall faint">Pinned items show with a marker.</span>
    </div>
    <button class="btn" data-action="commit-vision" data-key="${key}">Add</button>`);
  setTimeout(()=>$("#v_text")&&$("#v_text").focus(),350);
}
function sheetDeepDuration(){
  openSheet(`${sheetHead("Deep Work","Session length")}
    <div class="choices" style="margin-top:20px">
      ${[25,50,90].map(m=>`<button class="choice ${S.deep.minutes===m?'on':''}" data-action="set-duration" data-m="${m}">${m} minutes</button>`).join("")}
    </div>`);
}
function exportData(){
  const btn=document.querySelector('[data-action="export-data"]');
  const restore=btn?btn.innerHTML:null;
  if(btn){btn.disabled=true;btn.innerHTML='<span class="spinner"></span>Exporting';}
  const run=()=>{
    try{
      const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
      const url=URL.createObjectURL(blob);const a=document.createElement("a");
      a.href=url;a.download="atelier-export.json";a.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000);toast("Exported.");
    }catch(e){toast("Export unavailable here.");}
    finally{ if(btn){btn.disabled=false;btn.innerHTML=restore;} }
  };
  setTimeout(run, reducedMotion()?0:480);
}

  if(e.target.id==="acSearch"){S.academy.q=e.target.value;save();
    const cur=document.activeElement;const pos=e.target.selectionStart;
    render();
    const ni=$("#acSearch");if(ni){ni.focus();try{ni.setSelectionRange(pos,pos);}catch(_){}}
  }
});

/* ============================================================
   GESTURES — horizontal swipe between tabs
   ============================================================ */
let tsx=0,tsy=0,swiping=false;
const ORDER=["daily","academy","schedule","deep","vision"];
document.getElementById("app").addEventListener("touchstart",(e)=>{
  if(e.touches.length!==1)return;tsx=e.touches[0].clientX;tsy=e.touches[0].clientY;swiping=true;
},{passive:true});
document.getElementById("app").addEventListener("touchend",(e)=>{
  if(!swiping)return;swiping=false;
  if(!S.onboarded||$("#deep").classList.contains("open"))return;
  const dx=e.changedTouches[0].clientX-tsx,dy=e.changedTouches[0].clientY-tsy;
  if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.6)return;
  if(S.academy.open)return; // don't swipe out of a drill-in
  let i=ORDER.indexOf(S.tab);if(i<0)i=0;
  if(dx<0&&i<ORDER.length-1)setTab(ORDER[i+1]);
  else if(dx>0&&i>0)setTab(ORDER[i-1]);
},{passive:true});

/* ============================================================
   BOOT
   ============================================================ */
let booted=false;
function boot(){
  if(booted)return;booted=true;
  $("#app").setAttribute("aria-hidden","false");
  if(!S.onboarded){onboarding();}
  else{render();}
}

// Splash: a real loading gate. Hold until webfonts resolve (no font swap on
// first paint), with a minimum on-screen time so it never flashes and a hard
// cap so a slow/blocked font load can never hang the app.
(function(){
  const MIN=1000, MAX=2600;
  const now=()=>(window.performance&&performance.now)?performance.now():Date.now();
  const t0=now();
  let closed=false;
  function finish(){
    if(closed)return;closed=true;
    const s=$("#splash");if(s)s.classList.add("gone");
    boot();
  }
  function whenReady(){ setTimeout(finish, Math.max(0, MIN-(now()-t0))); }
  function start(){
    if(document.fonts && document.fonts.ready && typeof document.fonts.ready.then==="function"){
      document.fonts.ready.then(whenReady, whenReady);
    }else{
      setTimeout(whenReady, 650);
    }
    setTimeout(finish, MAX); // hard cap
  }
  if(document.readyState==="complete") start();
  else window.addEventListener("load", start);
})();
